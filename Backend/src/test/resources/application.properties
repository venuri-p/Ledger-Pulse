# 1. H2 Database Configuration for Testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Ensures your database tables are created automatically for the test
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# 2. Fake JWT variables for CI testing
jwt.secret=VGhpcy1pcy1hLWZha2Utc2VjcmV0LWtleS1mb3ItdGVzdGluZy1vbmx5LW1ha2UtaXQtbG9uZw==
jwt.expiration=86400000

# 3. Fake Email Configuration for CI testing
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@example.com
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
